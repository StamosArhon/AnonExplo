name: ${PROJECT_NAME:-anonexplo}

services:
  host-gateway:
    image: ${HOST_GATEWAY_IMAGE:-nginx:stable-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236}
    restart: unless-stopped
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      - ui
      - backend
      - search-provider
    ports:
      - 127.0.0.1:${UI_PORT:-3000}:3000
      - 127.0.0.1:${BACKEND_PORT:-8000}:8000
      - 127.0.0.1:${SEARXNG_UI_PORT:-8085}:8085
    networks:
      - host_access
      - core_internal
    volumes:
      - ./configs/localhost-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/ && wget -q -O /dev/null http://127.0.0.1:8000/api/v1/health && wget -q -O /dev/null http://127.0.0.1:8085/",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: ./apps/ui
    restart: unless-stopped
    environment:
      UI_HOST: 0.0.0.0
      UI_PORT: 8080
      UI_API_BASE_URL: http://127.0.0.1:${BACKEND_PORT:-8000}${API_PREFIX:-/api/v1}
      UI_STANDALONE_SEARCH_URL: http://127.0.0.1:${SEARXNG_UI_PORT:-8085}
      UI_ENVIRONMENT: local
    depends_on:
      - backend
    networks:
      - core_internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./apps/backend
    restart: unless-stopped
    environment:
      APP_NAME: AnonExplo Orchestrator
      API_PREFIX: ${API_PREFIX:-/api/v1}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai_compatible}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://model-backend:8080/v1}
      MODEL_NAME: ${MODEL_NAME:-qwen2.5-7b-instruct-q4_k_m}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-90}
      MODEL_PROBE_TIMEOUT_SECONDS: ${MODEL_PROBE_TIMEOUT_SECONDS:-5}
      MODEL_RUNTIME_PROFILE: ${MODEL_RUNTIME_PROFILE:-llama.cpp-cuda}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-searxng}
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-http://search-provider:8080}
      SEARCH_RESULT_LIMIT: ${SEARCH_RESULT_LIMIT:-8}
      SEARCH_CATEGORIES: ${SEARCH_CATEGORIES:-general,news}
      SEARCH_LANGUAGE: ${SEARCH_LANGUAGE:-all}
      SEARCH_TIME_RANGE: ${SEARCH_TIME_RANGE:-}
      SEARCH_ENGINES: ${SEARCH_ENGINES:-}
      SEARCH_REQUEST_TIMEOUT_SECONDS: ${SEARCH_REQUEST_TIMEOUT_SECONDS:-20}
      FETCH_BASE_URL: ${FETCH_BASE_URL:-http://fetcher:8081}
      FETCH_REQUEST_TIMEOUT_SECONDS: ${FETCH_REQUEST_TIMEOUT_SECONDS:-20}
      GROUNDING_SOURCE_CHAR_LIMIT: ${GROUNDING_SOURCE_CHAR_LIMIT:-3000}
      GROUNDING_TOTAL_CONTEXT_CHARS: ${GROUNDING_TOTAL_CONTEXT_CHARS:-9000}
      GROUNDING_PREVIEW_CHARS: ${GROUNDING_PREVIEW_CHARS:-1200}
      GROUNDING_MODEL_TEMPERATURE: ${GROUNDING_MODEL_TEMPERATURE:-0.1}
    depends_on:
      - fetcher
    networks:
      - core_internal
      - model_internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  fetcher:
    build:
      context: ./services/fetcher
    restart: unless-stopped
    environment:
      FETCHER_HOST: 0.0.0.0
      FETCHER_PORT: 8081
      FETCH_REQUEST_TIMEOUT_SECONDS: ${FETCH_REQUEST_TIMEOUT_SECONDS:-20}
      FETCH_MAX_RESPONSE_BYTES: ${FETCH_MAX_RESPONSE_BYTES:-2000000}
      FETCH_MAX_TEXT_CHARS: ${FETCH_MAX_TEXT_CHARS:-40000}
      FETCH_USER_AGENT: ${FETCH_USER_AGENT:-AnonExploFetcher/0.1}
    networks:
      - core_internal
      - egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  search-provider:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest@sha256:00b57726b3d732c11f874af964ce68c9e5c38c02d73040567603c0681f0b6007}
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-replace-with-local-random-secret}
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./configs/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./data/searxng-cache:/var/cache/searxng
    networks:
      - core_internal
      - egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  model-backend:
    profiles:
      - llamacpp
    image: ${MODEL_RUNTIME_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:59c2b6abd3c898e8f3b7beef3e2c871488d9a9783b6c6d766ffb1409e11c8044}
    command:
      - -m
      - /models/${MODEL_FILE_NAME:-Qwen2.5-7B-Instruct.Q4_K_M.gguf}
      - --alias
      - ${MODEL_NAME:-qwen2.5-7b-instruct-q4_k_m}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - ${MODEL_CONTEXT_SIZE:-4096}
      - -ngl
      - ${MODEL_GPU_LAYERS:-99}
      - -b
      - ${MODEL_BATCH_SIZE:-512}
      - -t
      - ${MODEL_THREADS:-8}
    gpus: ${MODEL_RUNTIME_GPUS:-all}
    restart: unless-stopped
    networks:
      - model_internal
    volumes:
      - ./data/models:/models:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/v1/models"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 300s

networks:
  host_access:
    driver: bridge
  core_internal:
    driver: bridge
    internal: true
  model_internal:
    driver: bridge
    internal: true
  egress:
    driver: bridge
