name: ${PROJECT_NAME:-anonexplo}

services:
  host-gateway:
    image: ${HOST_GATEWAY_IMAGE:-nginx:stable-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236}
    restart: unless-stopped
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      - search-provider
    ports:
      - 127.0.0.1:${SEARXNG_UI_PORT:-8085}:8085
    networks:
      - host_access
      - core_internal
    volumes:
      - ./configs/localhost-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8085/",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  search-provider:
    # Local repair image; base digest and exact source guard live in this context.
    # Old SEARXNG_IMAGE environment values intentionally cannot bypass the fix.
    image: anonexplo/searxng:date-merge-v1
    pull_policy: never
    build:
      context: ./images/searxng
      dockerfile: Dockerfile
      network: none
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-replace-with-local-random-secret}
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./configs/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./data/searxng-cache:/var/cache/searxng
    networks:
      - core_internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  host_access:
    driver: bridge
  core_internal:
    driver: bridge
    internal: true
