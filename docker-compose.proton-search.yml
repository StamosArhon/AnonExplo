services:
  search-vpn:
    profiles:
      - proton-search
    image: ${SEARCH_VPN_IMAGE:-qmcgaw/gluetun:v3.40.0@sha256:2b42bfa046757145a5155acece417b65b4443c8033fb88661a8e9dcf7fda5a00}
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      SERVER_COUNTRIES: ${PROTON_SERVER_COUNTRIES:-Switzerland}
      FIREWALL_INPUT_PORTS: "8080"
      # Gluetun manages the tunnel as root; avoid creating users on read-only /etc.
      PUID: "0"
      PGID: "0"
      HTTP_CONTROL_SERVER_ADDRESS: "127.0.0.1:8000"
      VERSION_INFORMATION: "off"
      PUBLICIP_FILE: "/tmp/public-ip"
    volumes:
      - type: bind
        source: ./data/proton/resolv.conf
        target: /etc/resolv.conf
        bind:
          create_host_path: false
      - type: bind
        source: ./data/proton/wireguard/wg0.conf
        target: /gluetun/wireguard/wg0.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      core_internal: {}
      egress: {}
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /gluetun
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/gluetun-entrypoint healthcheck && nslookup example.com 127.0.0.1 >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  search-provider:
    network_mode: "service:search-vpn"
    networks: !reset []
    volumes:
      - ./configs/searxng/resolv.vpn.conf:/etc/resolv.conf:ro
    depends_on:
      search-vpn:
        condition: service_healthy

  host-gateway:
    volumes:
      - ./configs/localhost-gateway/nginx.proton-search.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      search-vpn:
        condition: service_healthy

networks:
  egress:
    driver: bridge
