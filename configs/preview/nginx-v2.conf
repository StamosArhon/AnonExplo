# Versioned endpoints let an already-open v1 page continue without a core restart.
location ~ ^/anonexplo-preview/(rank-v2|plan)$ {
    if ($request_method != POST) { return 405; }
    if ($http_content_type != application/json) { return 415; }
    if ($http_sec_fetch_site = cross-site) { return 403; }
    if ($host != 127.0.0.1) { return 403; }
    rewrite ^/anonexplo-preview/(rank-v2|plan)$ /$1 break;
    proxy_pass http://unix:/run/anonexplo-preview/model.sock;
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 1s;
    proxy_send_timeout 2s;
    proxy_read_timeout 9s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
}
