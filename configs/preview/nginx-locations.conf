# Included only inside the localhost search server. No request logs/temp payloads.
location = /anonexplo-preview.js {
    alias /opt/anonexplo-preview/preview.js;
    default_type application/javascript;
}
location = /anonexplo-preview/rank {
    # Custom JSON header forces cross-origin preflight, which is refused.
    if ($request_method != POST) { return 405; }
    if ($http_content_type != application/json) { return 415; }
    if ($http_sec_fetch_site = cross-site) { return 403; }
    if ($host != 127.0.0.1) { return 403; }
    proxy_pass http://unix:/run/anonexplo-preview/model.sock:/rank;
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 1s;
    proxy_send_timeout 2s;
    proxy_read_timeout 5s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
}
