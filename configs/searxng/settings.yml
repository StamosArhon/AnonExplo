use_default_settings:
  engines:
    keep_only:
      - brave
      - brave.news
      - bing
      - duckduckgo
      - google
      - startpage
      - mojeek
      - qwant
      - yahoo
      - wikipedia
      - duckduckgo news
      - google news
      - reuters
      - arxiv
      - pubmed
      - crossref

general:
  instance_name: "AnonExplo Local Search"

search:
  autocomplete: ""
  favicon_resolver: ""
  default_lang: "auto"
  safe_search: 0
  formats:
    - html
    - json

server:
  limiter: false
  public_instance: false
  image_proxy: true

ui:
  query_in_title: false

# Do not let old browser cookies re-enable auxiliary third-party requests.
# Language, engines, categories and appearance remain user-selectable.
preferences:
  lock:
    - autocomplete
    - favicon_resolver
    - image_proxy
    - query_in_title

# Keep the local instance responsive with a focused general/news/research
# catalogue. Individual engine overrides below can be adjusted without
# rewriting the engine implementations.
outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

engines:
  # News engines are separate from general web engines.
  - name: brave.news
    disabled: false
    timeout: 6.0
  # Available in Preferences, but not contacted by ordinary default searches.
  # Keep CAPTCHA/access-denied sources opt-in; do not disable their backoff.
  - name: duckduckgo
    disabled: true
    timeout: 6.0
  - name: google
    disabled: true
    timeout: 6.0
  - name: startpage
    disabled: true
    timeout: 6.0
  - name: mojeek
    disabled: true
    timeout: 6.0
  - name: qwant
    disabled: true
    timeout: 6.0
  - name: yahoo
    disabled: false
    timeout: 6.0
  # Keep several general engines available so one upstream rate limit does not
  # collapse ordinary searches to Wikipedia-only results.
  - name: brave
    timeout: 5.0
  - name: bing
    timeout: 5.0
    disabled: false
  - name: wikipedia
    timeout: 5.0
  - name: duckduckgo news
    timeout: 6.0
  - name: google news
    timeout: 6.0
    disabled: true
  - name: reuters
    timeout: 6.0
  - name: arxiv
    timeout: 8.0
  - name: pubmed
    timeout: 8.0
  - name: crossref
    timeout: 8.0
    disabled: false
