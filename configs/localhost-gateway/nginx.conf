worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log stderr warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 3000;
        server_name _;

        location / {
            proxy_pass http://ui:8080;
        }
    }

    server {
        listen 8000;
        server_name _;

        location / {
            proxy_connect_timeout 15s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
            proxy_pass http://backend:8000;
        }
    }

    server {
        listen 8085;
        server_name _;

        # Docker DNS, refreshed after container address changes. The destination
        # is fixed here, never derived from a request Host or query parameter.
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 3s;
        set $search_upstream search-provider:8080;

        # nginx error messages can contain the full GET query even with access
        # logging disabled. Keep this search vhost out of persistent logs.
        error_log /dev/null;
        proxy_hide_header Cache-Control;
        proxy_hide_header Referrer-Policy;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        client_max_body_size 64k;
        client_body_buffer_size 64k;

        location / {
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_intercept_errors on;
            error_page 502 504 =503 @search_unavailable;
            proxy_pass http://$search_upstream;
        }

        location @search_unavailable {
            default_type text/plain;
            return 503 "AnonExplo search is temporarily unavailable. Check the local search-provider and search-vpn services. No external search fallback was used. Retry after recovery.";
        }
    }
}
